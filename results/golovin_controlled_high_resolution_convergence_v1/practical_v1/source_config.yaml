# Fresh high-resolution continuation of the controlled Golovin convergence
# experiment. Preparing this file and its matrix does not submit compute.
#
# No model member, collision seed, controlled-bundle label, run label or raw
# output path from golovin_controlled_resolution_convergence_v1 is reused.

experiment:
  name: golovin_controlled_high_resolution_convergence_v1
  status: production_ready_not_submitted
  kernel: golovin
  initialization_family: controlled
  seed_namespace: cleo-sdm-convergence/golovin-controlled-high-resolution/v1

analysis_protocol:
  version: 2
  amended_on: 2026-07-30
  amendment: >-
    The researcher changed both M6 analytical-bias and adjacent-resolution
    equivalence margins from 0.10 to 0.05. The completed v1 analysis remains
    immutable and records the original thresholds.

matrix:
  max_superdroplets: [16384, 32768, 65536, 131072]
  collision_timesteps_s: [0.1]
  members_per_cell: 100
  observation_timestep_s: 300.0
  end_time_s: 3600.0
  model_threads: 1
  collision_seed_design: unique_per_case
  controlled_bundle_labels:
    16384: golovin_controlled_highres_N016384_v1
    32768: golovin_controlled_highres_N032768_v1
    65536: golovin_controlled_highres_N065536_v1
    131072: golovin_controlled_highres_N131072_v1

diagnostics:
  radius_minimum_um: 1.0
  radius_maximum_um: 5000.0
  primary_log_radius_bins: 500
  sensitivity_log_radius_bins: [250, 1000]
  decision_times_s: [600.0, 1200.0, 1800.0, 2400.0, 3000.0, 3600.0]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 20260730
  bin_robustness_policy: require_resolution_decision_at_all_registered_bin_counts
  ensemble_size_sensitivity:
    time_s: 3600.0
    member_counts: [5, 10, 20, 40, 60, 80, 100]
    random_subset_draws: 2000
    random_subset_seed: 20260731
    log_radius_bins: 500

practical_convergence:
  status: researcher_approved_existing_data_reanalysis_pending_clara_review
  protocol_version: 1
  primary_log_radius_bins: 500
  sensitivity_log_radius_bins: [250, 1000]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 2026073007
  ensemble_prefixes: [20, 40, 60, 80, 100]
  final_prefixes_for_stability: [80, 100]
  minimum_worthwhile_improvement_absolute: 0.01
  maximum_point_change_between_final_prefixes: 0.01
  require_two_successive_doublings: true
  sensitivity_bins_are_diagnostic_only: true

convergence_criteria:
  analytical_agreement:
    maximum_l1_upper_95ci: 0.05
    moment0_relative_bias_margin: 0.05
    moment6_relative_bias_margin: 0.05
  adjacent_level_equivalence:
    l1_absolute_difference_margin: 0.01
    moment0_relative_difference_margin: 0.05
    moment6_relative_difference_margin: 0.05
  maximum_95ci_half_width:
    l1_absolute: 0.01
    moment0_relative: 0.025
    moment6_relative: 0.05
  maximum_relative_liquid_mass_drift: 1.0e-7
  maximum_out_of_range_mass_fraction: 1.0e-6
  require_pass_at_every_decision_time: true
  require_next_level_confirmation: true

timestep_selection_provenance:
  selected_collision_timestep_s: 0.1
  reference_collision_timestep_s: 0.1
  source_experiment: golovin_controlled_resolution_convergence_v1
  source_result_status: no_resolution_accepted_in_initial_matrix

data_isolation:
  previous_raw_members_reused: 0
  previous_collision_seeds_reused: 0
  previous_bundle_labels_reused: 0
  fresh_member_count: 400
  previous_compact_result_used_for_planning_only: true

authorization:
  matrix_reviewed: true
  submission_authorized: false
  reason: >-
    The researcher approved preparation of a completely fresh 4-by-100
    experiment. A separate explicit compute and storage disclosure is still
    required before Slurm submission.
