# Stage-0 development settings for the Golovin diagnostics and matrix tooling.
#
# This file is deliberately marked "development".  It can be used to create a
# tiny matrix for testing paths, seeds and resume/refusal behavior, but it is
# not authorization to submit a production convergence ensemble.

experiment:
  name: golovin_stage0_development
  status: development_only
  kernel: golovin
  initialization_family: operational_stochastic
  seed_namespace: cleo-sdm-convergence/golovin-stage0-development/v1

matrix:
  max_superdroplets: [1024, 2048]
  collision_timesteps_s: [1.0]
  members_per_cell: 2
  observation_timestep_s: 300.0
  end_time_s: 3600.0
  model_threads: 1

diagnostics:
  # Fixed for every member, time and resolution in this development matrix.
  radius_minimum_um: 1.0
  radius_maximum_um: 5000.0
  number_of_log_radius_bins: 500
  bin_robustness_counts: [250, 500, 1000]
  maximum_out_of_range_mass_fraction: 1.0e-6
  decision_times_s: [600.0, 1200.0, 1800.0, 2400.0, 3000.0, 3600.0]
  cloud_drop_threshold_um: 40.0
  large_drop_threshold_um: 1000.0
  # Descriptive interval-censored tail timing only; it is not a production
  # Golovin convergence gate and is not rain onset.
  onset_radius_threshold_um: 1000.0
  onset_mass_fraction: 0.10
  mass_weighted_radius_quantile: 0.99
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 20260728

controlled_initialization:
  status: frozen_bundle_software_local_validated_levante_creation_and_reuse_pending
  method: deterministic_log_volume_bin_quadrature
  radius_support_um: [1.0, 75.0]
  integer_multiplicity_allocation: largest_remainder
  freeze_binary_within_resolution: true
  maximum_relative_moment0_error: 1.0e-10
  maximum_relative_moment3_error: 1.0e-10
  maximum_relative_moment6_error: 0.01
  require_representative_inside_source_bin: true

convergence_criteria:
  status: accepted_for_implementation
  analytical_agreement:
    maximum_l1_upper_95ci: 0.05
    moment0_relative_bias_margin: 0.05
    moment6_relative_bias_margin: 0.10
  adjacent_level_equivalence:
    l1_absolute_difference_margin: 0.01
    moment0_relative_difference_margin: 0.05
    moment6_relative_difference_margin: 0.10
  maximum_95ci_half_width:
    l1_absolute: 0.01
    moment0_fraction_of_analytical_reference: 0.025
    moment6_fraction_of_analytical_reference: 0.05
  maximum_relative_liquid_mass_drift: 1.0e-7
  require_pass_at_every_decision_time: true
  require_next_level_confirmation: true

levante:
  temporary_account: bb1153
  production_compute_authorized: false

provisional_decisions:
  approved_for_production: false
  reason: >-
    Scientific definitions are recorded in ADR 0004 and the controlled
    initializer has passed local numerical and unit tests. Native CLEO binary
    validation, robustness diagnostics, frozen-binary orchestration and a
    compute/storage pilot still remain before a production ensemble is
    authorized.
