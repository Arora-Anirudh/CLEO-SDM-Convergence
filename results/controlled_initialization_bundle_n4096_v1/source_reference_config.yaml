# Reference starting configuration for the collision-only box model.
#
# The initialization parameters are intentionally inherited from
# PerformanceTestingCLEO/src/collisions0d, following Clara Bayley's direction.
# They are a documented starting point, not a convergence result or an
# immutable final scientific configuration.

python_initconds:
  grid:
    zgrid: [0.0, 10000.0]
    xgrid: [0.0, 10000.0]
    ygrid: [0.0, 10000.0]
  supers:
    dryradius: 1.0e-16
    rspan: [1.0e-6, 7.5e-5]
    xi_min: 10
    volexpr0: 30.531e-6
    numconc: 8388608

kokkos_settings:
  num_threads: 1
  map_device_id_by: mpi_rank

domain:
  # "0-D" means there is no transport or dynamical evolution. The three
  # coordinates are retained here to reproduce the collisions0d initializer.
  nspacedims: 3
  ngbxs: 1
  maxnsupers: 4096

timesteps:
  CONDTSTEP: 1
  COLLTSTEP: 1
  MOTIONTSTEP: 5
  COUPLTSTEP: 3600
  OBSTSTEP: 300
  T_END: 3600

inputfiles:
  constants_filename: ./build/_deps/cleo-src/libs/cleoconstants.hpp
  grid_filename: ./build/share/collisions0d_grid.dat

initsupers:
  type: frombinary
  initsupers_filename: ./build/share/collisions0d_supers.dat

outputdata:
  setup_filename: ./build/bin/collisions0d_setup.txt
  zarrbasedir: ./build/bin/collisions0d_solution.zarr
  maxchunk: 2500000
