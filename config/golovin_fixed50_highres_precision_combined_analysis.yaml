# Analysis-only definition for the read-only combined view created after the
# targeted 200-member precision extension has completed and passed Stage-0.
# No model runner may use this file or view: each member retains the manifest
# of the immutable matrix that originally created it.

experiment:
  name: golovin_fixed50_highres_precision_combined_analysis_v1
  status: submission_authorized
  kernel: golovin
  initialization_family: controlled
  seed_namespace: cleo-sdm-convergence/golovin-fixed50-highres-precision-extension/v1

analysis_protocol:
  version: 1
  classification: read_only_targeted_followup_analysis
  formal_convergence_claim_permitted: false
  rationale: >-
    This view combines the completed balanced fixed-50 ladder with a single,
    prospectively frozen high-resolution precision extension. The original
    fixed-50 formal result remains separately preserved. This analysis asks
    whether the predefined additional independent histories resolve the
    specific late-time high-resolution practical uncertainty.

matrix:
  max_superdroplets: [262144, 524288, 1048576]
  members_per_resolution:
    262144: 150
    524288: 150
    1048576: 50
  observation_timestep_s: 600.0
  end_time_s: 3600.0
  model_threads: 1

diagnostics:
  radius_minimum_um: 1.0
  radius_maximum_um: 5000.0
  primary_log_radius_bins: 500
  sensitivity_log_radius_bins: [250, 1000]
  decision_times_s: [600.0, 1200.0, 1800.0, 2400.0, 3000.0, 3600.0]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 2026080101
  bin_robustness_policy: diagnostic_only
  ensemble_size_sensitivity:
    time_s: 3600.0
    member_counts: [10, 20, 30, 40, 50]
    random_subset_draws: 2000
    random_subset_seed: 2026080102
    log_radius_bins: 500

practical_convergence:
  status: researcher_approved_prospective_fixed_design
  protocol_version: 3
  primary_log_radius_bins: 500
  sensitivity_log_radius_bins: [250, 1000]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 2026080103
  minimum_worthwhile_improvement_absolute: 0.01
  require_two_successive_doublings: true
  sensitivity_bins_are_diagnostic_only: true
  explicitly_excluded_diagnostic: successive_improvement_ratio
  targeted_member_counts_by_resolution:
    262144: 150
    524288: 150
    1048576: 50

convergence_criteria:
  analytical_agreement:
    maximum_l1_upper_95ci: 0.05
    moment0_relative_bias_margin: 0.05
    moment6_relative_bias_margin: 0.05
  adjacent_level_equivalence:
    l1_absolute_difference_margin: 0.01
    moment0_relative_difference_margin: 0.05
    moment6_relative_difference_margin: 0.05
  maximum_95ci_half_width:
    l1_absolute: 0.01
    moment0_relative: 0.025
    moment6_relative: 0.05
  maximum_relative_liquid_mass_drift: 1.0e-7
  maximum_out_of_range_mass_fraction: 1.0e-6
  require_pass_at_every_decision_time: true
  require_next_level_confirmation: true

timestep_selection_provenance:
  selected_collision_timestep_s: 0.1

authorization:
  submission_authorized: true
