# Prospectively frozen, targeted high-resolution precision extension.
#
# The completed balanced fixed-50 ladder remains intact and is never
# overwritten. This new matrix adds 100 independent collision streams only at
# the two resolutions that limited the late-time M6 practical criterion. Its
# analysis joins the old 50-member outputs read-only, yielding 150/150/50
# members at 262144/524288/1048576 SDs. This is a transparent follow-up
# precision experiment, not a retroactive reclassification of the original
# balanced protocol.

experiment:
  name: golovin_fixed50_highres_precision_extension_v1
  matrix_stage: golovin_fixed50_extended_resolution_convergence_v1
  status: production_ready_not_submitted
  kernel: golovin
  initialization_family: controlled
  seed_namespace: cleo-sdm-convergence/golovin-fixed50-highres-precision-extension/v1

analysis_protocol:
  version: 1
  classification: prospectively_frozen_targeted_high_resolution_precision_extension
  formal_convergence_claim_permitted: false
  rationale: >-
    The completed fixed-50 ladder's 262144-to-524288 late-time M6
    one-sided upper bound was 1.174 percentage points, slightly above the
    predeclared one-percentage-point practical margin. This follow-up adds a
    single, fixed block of 100 independent collision streams at both levels
    to reduce uncertainty in that specific comparison. The unchanged
    1048576-SD 50-member ensemble supplies the next-doubling confirmation.

matrix:
  max_superdroplets: [262144, 524288]
  collision_timesteps_s: [0.1]
  members_per_cell: 100
  member_index_start: 50
  observation_timestep_s: 600.0
  end_time_s: 3600.0
  model_threads: 1
  collision_seed_design: unique_per_case
  controlled_bundle_labels:
    262144: golovin_fixed50_extended_N262144_v1
    524288: golovin_fixed50_extended_N524288_v1

diagnostics:
  radius_minimum_um: 1.0
  radius_maximum_um: 5000.0
  primary_log_radius_bins: 500
  sensitivity_log_radius_bins: [250, 1000]
  decision_times_s: [600.0, 1200.0, 1800.0, 2400.0, 3000.0, 3600.0]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 2026080101
  bin_robustness_policy: diagnostic_only
  ensemble_size_sensitivity:
    time_s: 3600.0
    member_counts: [10, 20, 30, 40, 50]
    random_subset_draws: 2000
    random_subset_seed: 2026080102
    log_radius_bins: 500

practical_convergence:
  status: researcher_approved_prospective_fixed_design
  protocol_version: 3
  primary_log_radius_bins: 500
  sensitivity_log_radius_bins: [250, 1000]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 2026080103
  minimum_worthwhile_improvement_absolute: 0.01
  require_two_successive_doublings: true
  sensitivity_bins_are_diagnostic_only: true
  explicitly_excluded_diagnostic: successive_improvement_ratio
  exclusion_reason: >-
    Ratios of successive error reductions are unstable under ensemble noise
    and approach a non-zero constant for ordinary power-law convergence.
  targeted_member_counts_by_resolution:
    262144: 150
    524288: 150
    1048576: 50

convergence_criteria:
  analytical_agreement:
    maximum_l1_upper_95ci: 0.05
    moment0_relative_bias_margin: 0.05
    moment6_relative_bias_margin: 0.05
  adjacent_level_equivalence:
    l1_absolute_difference_margin: 0.01
    moment0_relative_difference_margin: 0.05
    moment6_relative_difference_margin: 0.05
  maximum_95ci_half_width:
    l1_absolute: 0.01
    moment0_relative: 0.025
    moment6_relative: 0.05
  maximum_relative_liquid_mass_drift: 1.0e-7
  maximum_out_of_range_mass_fraction: 1.0e-6
  require_pass_at_every_decision_time: true
  require_next_level_confirmation: true

timestep_selection_provenance:
  selected_collision_timestep_s: 0.1
  reference_collision_timestep_s: 0.1
  source_experiment: golovin_controlled_timestep_screen_v1
  source_result_status: selected_0p1_second

data_isolation:
  previous_raw_members_reused_for_model: 0
  previous_collision_seeds_reused: 0
  previous_run_labels_reused: 0
  controlled_bundle_labels_reused_read_only: 2
  new_member_count: 200
  analysis_view_uses_existing_members_read_only:
    262144: 50
    524288: 50
    1048576: 50
  targeted_final_member_counts:
    262144: 150
    524288: 150
    1048576: 50

authorization:
  matrix_reviewed: true
  submission_authorized: false
  required_before_submission:
    - exact-revision build verification
    - immutable controlled-bundle checksum verification before and after every member
    - fresh extension run and record paths
    - live scratch-capacity check
    - explicit compute and storage disclosure
