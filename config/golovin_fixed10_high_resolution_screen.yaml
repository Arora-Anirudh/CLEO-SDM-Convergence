# Exploratory fixed-10-member Golovin resolution screen. This configuration
# defines a new, fully isolated matrix; it does not authorize any compute.

experiment:
  name: golovin_fixed10_high_resolution_screen_v1
  status: preproduction_gate
  kernel: golovin
  initialization_family: controlled
  seed_namespace: cleo-sdm-convergence/golovin-fixed10-high-resolution-screen/v1

analysis_protocol:
  version: 1
  classification: exploratory_fixed_10_member_screen
  formal_convergence_claim_permitted: false
  rationale: >-
    Ten independent collision streams are intentionally used to screen a broad
    resolution ladder and measure computational scaling. They do not replace
    the completed 100-member uncertainty experiment.

matrix:
  max_superdroplets: [4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288]
  collision_timesteps_s: [0.1]
  members_per_cell: 10
  observation_timestep_s: 300.0
  end_time_s: 3600.0
  model_threads: 1
  collision_seed_design: unique_per_case
  controlled_bundle_labels:
    4096: golovin_fixed10_screen_N004096_v1
    8192: golovin_fixed10_screen_N008192_v1
    16384: golovin_fixed10_screen_N016384_v1
    32768: golovin_fixed10_screen_N032768_v1
    65536: golovin_fixed10_screen_N065536_v1
    131072: golovin_fixed10_screen_N131072_v1
    262144: golovin_fixed10_screen_N262144_v1
    524288: golovin_fixed10_screen_N524288_v1

diagnostics:
  radius_minimum_um: 1.0
  radius_maximum_um: 5000.0
  primary_log_radius_bins: 500
  sensitivity_log_radius_bins: [250, 1000]
  decision_times_s: [600.0, 1200.0, 1800.0, 2400.0, 3000.0, 3600.0]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 2026073002
  bin_robustness_policy: diagnostic_only
  ensemble_size_sensitivity:
    time_s: 3600.0
    member_counts: [5, 10]
    random_subset_draws: 2000
    random_subset_seed: 2026073003
    log_radius_bins: 500

# These gates remain useful integrity and descriptive diagnostics. A formal
# accepted-resolution decision is explicitly disabled by analysis_protocol.
convergence_criteria:
  analytical_agreement:
    maximum_l1_upper_95ci: 0.05
    moment0_relative_bias_margin: 0.05
    moment6_relative_bias_margin: 0.05
  adjacent_level_equivalence:
    l1_absolute_difference_margin: 0.01
    moment0_relative_difference_margin: 0.05
    moment6_relative_difference_margin: 0.05
  maximum_95ci_half_width:
    l1_absolute: 0.01
    moment0_relative: 0.025
    moment6_relative: 0.05
  maximum_relative_liquid_mass_drift: 1.0e-7
  maximum_out_of_range_mass_fraction: 1.0e-6
  require_pass_at_every_decision_time: true
  require_next_level_confirmation: true

timestep_selection_provenance:
  selected_collision_timestep_s: 0.1
  reference_collision_timestep_s: 0.1
  source_experiment: golovin_controlled_high_resolution_convergence_v1
  source_result_status: strict_equivalence_unresolved_at_100_members

data_isolation:
  previous_raw_members_reused: 0
  previous_collision_seeds_reused: 0
  previous_bundle_labels_reused: 0
  fresh_member_count: 80
  earlier_compact_results_used_for_planning_only: true

authorization:
  matrix_reviewed: true
  submission_authorized: false
  required_before_submission:
    - exact-revision build verification
    - fresh controlled-bundle verification
    - isolated 524288-SD feasibility member
    - explicit resource and storage disclosure
