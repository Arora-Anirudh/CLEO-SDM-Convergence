# Stage-0 development settings for the Golovin diagnostics and matrix tooling.
#
# This file is deliberately marked "development".  It can be used to create a
# tiny matrix for testing paths, seeds and resume/refusal behavior, but it is
# not authorization to submit a production convergence ensemble.

experiment:
  name: golovin_stage0_development
  status: development_only
  kernel: golovin
  initialization_family: operational_stochastic
  seed_namespace: cleo-sdm-convergence/golovin-stage0-development/v1

matrix:
  max_superdroplets: [1024, 2048]
  collision_timesteps_s: [1.0]
  members_per_cell: 2
  observation_timestep_s: 300.0
  end_time_s: 3600.0
  model_threads: 1

diagnostics:
  # Fixed for every member, time and resolution in this development matrix.
  radius_minimum_um: 1.0
  radius_maximum_um: 5000.0
  number_of_log_radius_bins: 500
  cloud_drop_threshold_um: 40.0
  large_drop_threshold_um: 1000.0
  # Optional tail-growth timing metric t_(R,f). This is not rain onset:
  # collisions0d has no sedimentation/fallout and its initial support extends
  # beyond the conventional 40 um cloud/rain separation.
  onset_radius_threshold_um: 1000.0
  onset_mass_fraction: 0.10
  mass_weighted_radius_quantile: 0.99
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 20260728

provisional_decisions:
  approved_for_production: false
  reason: >-
    Bin range, tail-growth threshold, observation interval, equivalence
    margins, controlled initializer and Levante account still require review.
