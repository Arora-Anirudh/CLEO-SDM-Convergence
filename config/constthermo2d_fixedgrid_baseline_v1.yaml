# Project-owned, provenance-frozen configuration for the CLEO constthermo2d
# baseline.  It is copied from CLEO v0.69.1 commit 9224585d, except that the
# host-thread count is set by the batch request (8 for the first smoke).
# File locations below are placeholders; the sealed runner substitutes an
# otherwise empty, case-specific run directory before it creates any data.

python_inputfiles:
  zgrid_max: 1500
  xgrid_max: 1500
  ygrid_max: 20
  zgrid_ngbxs: 20
  xgrid_ngbxs: 20
  sd_zlim: 500
  nsupers_pergbx: 8
  rspan:
    - 3e-9
    - 3e-6
  geomeans:
    - 0.02e-6
    - 0.15e-6
  geosigs:
    - 1.4
    - 1.6
  scalefacs:
    - 0.6
    - 0.4
  numconc: 1e7
  thermo_PRESSz0: 101315
  thermo_THETA: 288.15
  thermo_WMAX: 0.6
  thermo_Zlength: 1500
  thermo_Xlength: 1500
  thermo_qvapmethod: "sratio"
  thermo_Zbase: 750
  thermo_sratios:
    - 0.99
    - 1.0025

kokkos_settings:
  num_threads: 8

domain:
  nspacedims: 2
  ngbxs: 400
  maxnsupers: 960

timesteps:
  CONDTSTEP: 1
  COLLTSTEP: 1
  MOTIONTSTEP: 2
  COUPLTSTEP: 7200
  OBSTSTEP: 120
  T_END: 7200

inputfiles:
  constants_filename: ./libs/cleoconstants.hpp
  grid_filename: ./build/share/const2d_dimlessGBxboundaries.dat

initsupers:
  type: frombinary
  initsupers_filename: ./build/share/const2d_dimlessSDsinit.dat

outputdata:
  setup_filename: ./build/bin/const2d_setup.txt
  zarrbasedir: ./build/bin/const2d_sol.zarr
  maxchunk: 2500000

microphysics:
  condensation:
    do_alter_thermo: false
    maxniters: 50
    MINSUBTSTEP: 0.001
    rtol: 0.0
    atol: 0.01

coupled_dynamics:
  type: fromfile
  press: ./build/share/const2d_dimlessthermo_press.dat
  temp: ./build/share/const2d_dimlessthermo_temp.dat
  qvap: ./build/share/const2d_dimlessthermo_qvap.dat
  qcond: ./build/share/const2d_dimlessthermo_qcond.dat
  wvel: ./build/share/const2d_dimlessthermo_wvel.dat
  uvel: ./build/share/const2d_dimlessthermo_uvel.dat
